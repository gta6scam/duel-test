<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIGHT CITY — a tiny open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; background: #04050d; height: 100%; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
'use strict';
/* =====================================================================
   NIGHT CITY — an original open-world crime game in one file.
   A neon-soaked city at permanent night, rendered with a hand-written
   software 3D engine (perspective projection + painter's algorithm) on
   a 2D canvas. No libraries, no assets, no network: every pixel is a
   canvas path, every sound is synthesized with Web Audio.
   The city's police are the point of the place: four interceptors, a
   searchlight helicopter, wanted heat that barely cools. The safehouse
   is the only reliable way out.
   ===================================================================== */

/* ---------------- Canvas & viewport ---------------- */
const cv = document.getElementById('gameCanvas');
const ctx = cv.getContext('2d');
let VW = 960, VH = 540, DPR = 1;
function fitCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.25);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cam.F = (VH / 2) / Math.tan(1.05 / 2);
}
window.addEventListener('resize', fitCanvas);

/* ---------------- Small utilities ---------------- */
const TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist2(ax, az, bx, bz) { const dx = ax - bx, dz = az - bz; return dx * dx + dz * dz; }
function angWrap(a) { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }
function angLerp(a, b, t) { return a + angWrap(b - a) * clamp(t, 0, 1); }
let seed = 1877;
function srand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function RR(a, b) { return a + srand() * (b - a); }
function RI(a, b) { return Math.floor(RR(a, b + 1)); }
function pick(arr) { return arr[Math.floor(srand() * arr.length) % arr.length]; }
/* Colours travel as [r,g,b] triples so fog and shading can mix them. */
function C(r, g, b) { return [r, g, b]; }
function css(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + (a === undefined ? 1 : a) + ')'; }
function mixc(c1, c2, t) { return C(lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)); }
function shadec(c, f) { return C(clamp(c[0] * f, 0, 255), clamp(c[1] * f, 0, 255), clamp(c[2] * f, 0, 255)); }

/* ---------------- Input ---------------- */
const keys = {};        /* physical keys, by KeyboardEvent.code */
const vkeys = {};       /* virtual keys, driven by the self-test */
const actionQueue = []; /* edge-triggered actions: 'enter', 'start' */
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (!e.repeat) {
    if (e.code === 'KeyE') actionQueue.push('enter');
    if (e.code === 'Enter') actionQueue.push('start');
    if (e.code === 'KeyM') AU.toggleMute();
  }
  keys[e.code] = true;
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
function keyDown(code) { return !!(keys[code] || vkeys[code]); }
let mouseX = -1, mouseY = -1, mouseClicked = false;
cv.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
cv.addEventListener('click', (e) => { mouseX = e.clientX; mouseY = e.clientY; mouseClicked = true; AU.init(); });

/* ---------------- Audio (all synthesized) ---------------- */
const AU = {
  ac: null, master: null, muted: false,
  engOsc: null, engOsc2: null, engGain: null, engFilter: null,
  sirOsc: null, sirGain: null, noiseBuf: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = this.muted ? 0 : 0.9;
      this.master.connect(this.ac.destination);
      /* Engine: two detuned saws through a lowpass, gain follows driving. */
      this.engOsc = this.ac.createOscillator(); this.engOsc.type = 'sawtooth';
      this.engOsc2 = this.ac.createOscillator(); this.engOsc2.type = 'square';
      this.engFilter = this.ac.createBiquadFilter(); this.engFilter.type = 'lowpass'; this.engFilter.frequency.value = 320;
      this.engGain = this.ac.createGain(); this.engGain.gain.value = 0;
      this.engOsc.connect(this.engFilter); this.engOsc2.connect(this.engFilter);
      this.engFilter.connect(this.engGain); this.engGain.connect(this.master);
      this.engOsc.start(); this.engOsc2.start();
      /* Siren: one square osc whose pitch the update loop flips. */
      this.sirOsc = this.ac.createOscillator(); this.sirOsc.type = 'square'; this.sirOsc.frequency.value = 760;
      this.sirGain = this.ac.createGain(); this.sirGain.gain.value = 0;
      this.sirOsc.connect(this.sirGain); this.sirGain.connect(this.master);
      this.sirOsc.start();
      /* A shared noise buffer for crashes and thunder. */
      const len = this.ac.sampleRate * 1.2;
      this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (err) { this.ac = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.9;
    showToast(this.muted ? 'SOUND OFF' : 'SOUND ON');
  },
  setEngine(on, speedAbs, throttle) {
    if (!this.ac) return;
    const t = this.ac.currentTime;
    const target = on ? 0.055 + Math.min(0.05, speedAbs * 0.0016) : 0;
    this.engGain.gain.setTargetAtTime(target, t, 0.09);
    const f = 52 + speedAbs * 3.4 + (throttle ? 14 : 0);
    this.engOsc.frequency.setTargetAtTime(f, t, 0.06);
    this.engOsc2.frequency.setTargetAtTime(f * 0.5 + 1.5, t, 0.06);
    this.engFilter.frequency.setTargetAtTime(280 + speedAbs * 22, t, 0.1);
  },
  setSiren(on, prox) {
    if (!this.ac) return;
    const t = this.ac.currentTime;
    this.sirGain.gain.setTargetAtTime(on ? 0.012 + prox * 0.05 : 0, t, 0.15);
    if (on) this.sirOsc.frequency.value = (Math.sin(T * 5.6) > 0) ? 715 : 955;
  },
  blip(freq, dur, type, vol, when) {
    if (!this.ac) return;
    const t0 = this.ac.currentTime + (when || 0);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.06, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  jingle() { const n = [659, 831, 988, 1319]; for (let i = 0; i < n.length; i++) this.blip(n[i], 0.16, 'square', 0.055, i * 0.09); },
  click() { this.blip(1250, 0.05, 'square', 0.04, 0); },
  pickup() { this.blip(880, 0.09, 'sine', 0.07, 0); this.blip(1320, 0.12, 'sine', 0.06, 0.07); },
  noiseBurst(dur, freq, vol) {
    if (!this.ac) return;
    const t = this.ac.currentTime;
    const src = this.ac.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = this.ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.05);
  },
  crash(hard) { this.noiseBurst(hard ? 0.28 : 0.14, 500, hard ? 0.22 : 0.1); },
  thunder() { this.noiseBurst(1.1, 160, 0.05); },
};

/* ---------------- World generation ----------------
   Streets run on a grid: street centres every PITCH units, blocks of
   BLOCK units between them. x grows east, z grows south on the map. */
const PITCH = 56, BLOCK = 40, WORLD = 296;
const STREET_X = [], STREET_Z = [];
for (let k = 0; k <= 9; k++) { STREET_X.push(-252 + k * PITCH); STREET_Z.push(-252 + k * PITCH); }

const NEON = [C(255, 46, 136), C(0, 229, 255), C(178, 107, 255), C(255, 179, 0), C(57, 255, 156), C(255, 84, 60)];
const WALLS = [C(29, 34, 51), C(35, 32, 56), C(26, 36, 54), C(38, 29, 51), C(32, 36, 46), C(24, 28, 44)];
const FOG = C(9, 11, 26);
const SAFE = { x: -238, z: -238, r: 11 };
const POIS = {
  arcade: { x: 80, z: -88, name: 'PIXEL ARCADE' },
  docks: { x: 36, z: 274, name: 'THE DOCKS' },
  bridge: { x: 250, z: 0, name: 'EAST BRIDGE' },
  hotel: { x: 193, z: 56, name: 'HOTEL LUMEN' },
  station: { x: -56, z: 176, name: 'NCPD STATION' },
};
const SIGN_WORDS = ['HOTEL LUMEN', 'CLUB PULSE', '24H RAMEN', 'NEON GYM', 'BAR LAGOON', 'CINEMA REX', 'LIQUOR', 'PAWN 24', 'TATTOO', 'CLUB VICE', 'DINER 9', 'MOTELO'];

const BUILDINGS = [];   /* {x,z,w,d,h,base,trim,windows:[{side,u,v,lit,col}],sign,signSide} */
const PALMS = [];       /* {x,z,lean,phase} */
const LAMPS = [];       /* {x,z} streetlight poles */
const BARRIERS = [];    /* {x,z,along} canal barriers on dead-end streets */
const BOXES = [];       /* dock containers & crates {x,z,w,d,h,base,rot} */

function buildWorld() {
  seed = 1877;
  for (let i = 0; i < 9; i++) {
    for (let j = 0; j < 9; j++) {
      const bx = STREET_X[i] + 8, bz = STREET_Z[j] + 8;      /* block corner */
      const cx = bx + BLOCK / 2, cz = bz + BLOCK / 2;        /* block centre */
      if (Math.abs(cx - SAFE.x) < 30 && Math.abs(cz - SAFE.z) < 30) continue; /* safehouse plot */
      const w = RR(26, 34), d = RR(26, 34), h = RR(14, 52) * (Math.abs(cx) < 90 && Math.abs(cz) < 90 ? 1.35 : 1);
      const b = {
        x: cx + RR(-2, 2), z: cz + RR(-2, 2), w, d, h,
        base: pick(WALLS), trim: pick(NEON),
        windows: [], sign: null, signSide: 0,
      };
      const floors = Math.max(2, Math.floor(h / 3.1)), cols = Math.max(3, Math.floor(Math.max(w, d) / 3.4));
      for (let side = 0; side < 4; side++) {
        for (let f = 0; f < floors; f++) {
          for (let cix = 0; cix < cols; cix++) {
            if (srand() < 0.42) continue;
            b.windows.push({
              side, u: (cix + 0.5) / cols, v: (f + 0.55) / floors,
              lit: srand() < 0.62,
              col: srand() < 0.72 ? C(255, 212, 137) : C(159, 216, 255),
            });
          }
        }
      }
      if (srand() < 0.4) { b.sign = pick(SIGN_WORDS); b.signSide = RI(0, 3); }
      BUILDINGS.push(b);
    }
  }
  /* The safehouse: a low, friendly block with a cyan sign and a pad. */
  BUILDINGS.push({
    x: SAFE.x - 6, z: SAFE.z - 6, w: 22, d: 18, h: 9, base: C(24, 44, 52), trim: C(0, 229, 255),
    windows: [], sign: 'SAFEHOUSE', signSide: 2,
  });
  /* Streetlights at every second intersection corner. */
  for (let i = 0; i <= 9; i += 2) for (let j = 0; j <= 9; j += 2) {
    LAMPS.push({ x: STREET_X[i] + 9.5, z: STREET_Z[j] + 9.5 });
    LAMPS.push({ x: STREET_X[i] - 9.5, z: STREET_Z[j] - 9.5 });
  }
  /* Palms along the south boulevard and scattered on sidewalks. */
  for (let x = -240; x <= 240; x += 24) PALMS.push({ x: x + RR(-3, 3), z: 244 + RR(-2, 2), lean: RR(-0.14, 0.14), phase: RR(0, TAU) });
  for (let n = 0; n < 26; n++) {
    const bx = pick(STREET_X) + pick([-9.5, 9.5]), bz = pick(STREET_Z) + pick([-9.5, 9.5]);
    PALMS.push({ x: bx, z: bz, lean: RR(-0.14, 0.14), phase: RR(0, TAU) });
  }
  /* Dock containers. */
  const contCols = [C(120, 52, 44), C(44, 84, 120), C(52, 110, 74), C(130, 96, 40), C(90, 60, 120)];
  for (let n = 0; n < 12; n++) {
    BOXES.push({ x: RR(-230, 230), z: RR(262, 284), w: RR(10, 16), d: 5, h: RR(3.4, 6.8), base: pick(contCols), rot: 0 });
  }
  /* Barriers where east-west streets meet the canal (all but the bridge street). */
  for (const zc of STREET_Z) if (Math.abs(zc) > 4) BARRIERS.push({ x: 258, z: zc, along: 'z' });
}
buildWorld();

/* Solid AABBs for collision: buildings and containers. */
function solidBoxes() {
  const out = [];
  for (const b of BUILDINGS) out.push({ minx: b.x - b.w / 2, maxx: b.x + b.w / 2, minz: b.z - b.d / 2, maxz: b.z + b.d / 2 });
  for (const b of BOXES) out.push({ minx: b.x - b.w / 2, maxx: b.x + b.w / 2, minz: b.z - b.d / 2, maxz: b.z + b.d / 2 });
  return out;
}
const SOLIDS = solidBoxes();
function collideCircle(x, z, r) {
  x = clamp(x, -WORLD + r, WORLD - r);
  z = clamp(z, -WORLD + r, WORLD - r);
  for (const s of SOLIDS) {
    const nx = clamp(x, s.minx, s.maxx), nz = clamp(z, s.minz, s.maxz);
    const dx = x - nx, dz = z - nz, d2 = dx * dx + dz * dz;
    if (d2 < r * r) {
      if (d2 > 0.0001) { const d = Math.sqrt(d2); x = nx + dx / d * r; z = nz + dz / d * r; }
      else { /* centre inside the box: push out along the smallest exit */
        const exits = [x - s.minx + r, s.maxx - x + r, z - s.minz + r, s.maxz - z + r];
        const m = Math.min(exits[0], exits[1], exits[2], exits[3]);
        if (m === exits[0]) x = s.minx - r; else if (m === exits[1]) x = s.maxx + r;
        else if (m === exits[2]) z = s.minz - r; else z = s.maxz + r;
      }
    }
  }
  /* The canal is water: keep everything west of it except on the bridge deck. */
  if (x > 258 && Math.abs(z) > 13) x = 258;
  return [x, z];
}

/* ---------------- Renderer: camera, projection, face queue ---------------- */
const cam = { x: 0, y: 9, z: 0, yaw: 0, pitch: -0.33, F: 600 };
function project(x, y, z) {
  const dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const vx = dx * cy - dz * sy;
  const vz = dx * sy + dz * cy;
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const vy = dy * cp + vz * sp;
  const vz2 = vz * cp - dy * sp;
  if (vz2 < 0.7) return null;
  const s = cam.F / vz2;
  return [VW / 2 + vx * s, VH / 2 - vy * s, vz2];
}
const faces = [];   /* {pts:[[sx,sy]..], depth, fill, alpha, stroke, extras:[{pts,fill,alpha}]} */
const sprites = []; /* {x,y,z,wr,img,alpha} world-space glow dots */
const labels = [];  /* {x,y,z,text,col,size} billboard neon text */
function addFace(pts3, fill, alpha, stroke) {
  const pts = [];
  let depth = 0;
  for (const p of pts3) {
    const pr = project(p[0], p[1], p[2]);
    if (!pr) return null;
    pts.push([pr[0], pr[1]]); depth += pr[2];
  }
  depth /= pts3.length;
  const fogF = clamp((depth - 55) / 240, 0, 0.82);
  const f = {
    pts, depth,
    fill: mixc(fill, FOG, fogF),
    alpha: alpha === undefined ? 1 : alpha,
    stroke: stroke ? mixc(stroke, FOG, fogF) : null,
    extras: [],
  };
  faces.push(f);
  return f;
}
function addExtra(face, pts3, fill, alpha) {
  if (!face) return;
  const pts = [];
  for (const p of pts3) {
    const pr = project(p[0], p[1], p[2]);
    if (!pr) return;
    pts.push([pr[0], pr[1]]);
  }
  face.extras.push({ pts, fill, alpha: alpha === undefined ? 1 : alpha });
}
function addSprite(x, y, z, wr, img, alpha) { sprites.push({ x, y, z, wr, img, alpha }); }
function addLabel(x, y, z, text, col, size) { labels.push({ x, y, z, text, col, size }); }
function circlePts(cx, cz, r, y, n) {
  const out = [];
  const cnt = n || 12;
  for (let i = 0; i < cnt; i++) { const a = i / cnt * TAU; out.push([cx + Math.cos(a) * r, y, cz + Math.sin(a) * r]); }
  return out;
}
/* Pre-rendered radial glow textures, one per colour family. */
function makeGlow(col) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 2, 32, 32, 32);
  grad.addColorStop(0, css(col, 0.9)); grad.addColorStop(0.35, css(col, 0.32)); grad.addColorStop(1, css(col, 0));
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
  return c;
}
const GLOW = {};
function initGlows() {
  GLOW.warm = makeGlow(C(255, 205, 130));
  GLOW.white = makeGlow(C(235, 242, 255));
  GLOW.pink = makeGlow(C(255, 46, 136));
  GLOW.cyan = makeGlow(C(0, 229, 255));
  GLOW.red = makeGlow(C(255, 52, 52));
  GLOW.blue = makeGlow(C(64, 120, 255));
  GLOW.gold = makeGlow(C(255, 196, 64));
}
initGlows();

/* A yaw-rotated box made of faces. Local +z is "forward", local +x is right.
   Returns the created faces by name so callers can attach window details. */
function addBox(cx, y0, cz, w, h, d, yaw, baseCol, faceCols) {
  const c = Math.cos(yaw), s = Math.sin(yaw);
  function corner(lx, ly, lz) { return [cx + lx * c + lz * s, y0 + ly, cz - lx * s + lz * c]; }
  const hw = w / 2, hd = d / 2;
  const defs = [
    ['top', [[-hw, h, -hd], [hw, h, -hd], [hw, h, hd], [-hw, h, hd]], 1.18],
    ['front', [[-hw, 0, hd], [hw, 0, hd], [hw, h, hd], [-hw, h, hd]], 1.0],
    ['back', [[hw, 0, -hd], [-hw, 0, -hd], [-hw, h, -hd], [hw, h, -hd]], 0.66],
    ['right', [[hw, 0, hd], [hw, 0, -hd], [hw, h, -hd], [hw, h, hd]], 0.84],
    ['left', [[-hw, 0, -hd], [-hw, 0, hd], [-hw, h, hd], [-hw, h, -hd]], 0.58],
  ];
  const out = {};
  for (const [name, pts, shade] of defs) {
    const col = (faceCols && faceCols[name]) ? faceCols[name] : shadec(baseCol, shade);
    out[name] = addFace(pts.map(p => corner(p[0], p[1], p[2])), col, 1);
  }
  return out;
}
function l2w(e, lx, lz) { /* entity-local offset to world */
  const c = Math.cos(e.heading), s = Math.sin(e.heading);
  return [e.x + lx * c + lz * s, e.z - lx * s + lz * c];
}

/* ---------------- Scene pieces ---------------- */
function drawGroundPieces() {
  const water = C(7, 19, 33), waterHi = C(13, 42, 68);
  addFace([[-320, 0.02, 292], [320, 0.02, 292], [320, 0.02, 360], [-320, 0.02, 360]], water, 1);      /* south bay */
  addFace([[260, 0.02, -300], [320, 0.02, -300], [320, 0.02, -13], [260, 0.02, -13]], water, 1);    /* canal north */
  addFace([[260, 0.02, 13], [320, 0.02, 13], [320, 0.02, 300], [260, 0.02, 300]], water, 1);        /* canal south */
  addFace([[-200, 0.04, 306], [-60, 0.04, 306], [-60, 0.04, 312], [-200, 0.04, 312]], waterHi, 0.7);
  addFace([[80, 0.04, 322], [240, 0.04, 322], [240, 0.04, 328], [80, 0.04, 328]], waterHi, 0.6);
  addFace([[272, 0.04, -180], [278, 0.04, -180], [278, 0.04, -60], [272, 0.04, -60]], waterHi, 0.5);
  /* Dock deck and the bridge over the canal. */
  addFace([[-300, 0.14, 256], [258, 0.14, 256], [258, 0.14, 292], [-300, 0.14, 292]], C(25, 28, 40), 1);
  addBox(278, 0, 0, 56, 1.1, 22, 0, C(33, 37, 52));
  addBox(278, 1.1, -10.6, 56, 0.8, 0.5, 0, C(52, 58, 78));
  addBox(278, 1.1, 10.6, 56, 0.8, 0.5, 0, C(52, 58, 78));
  /* Sidewalk slabs, one per block. */
  const walk = C(34, 38, 53);
  for (let i = 0; i < 9; i++) for (let j = 0; j < 9; j++) {
    const x0 = STREET_X[i] + 8, z0 = STREET_Z[j] + 8;
    if (Math.abs(x0 + 20 - SAFE.x) < 30 && Math.abs(z0 + 20 - SAFE.z) < 30) continue;
    addFace([[x0, 0.22, z0], [x0 + BLOCK, 0.22, z0], [x0 + BLOCK, 0.22, z0 + BLOCK], [x0, 0.22, z0 + BLOCK]], walk, 1);
  }
  /* Safehouse pad: a calm cyan ring on the ground. */
  addFace(circlePts(SAFE.x, SAFE.z, SAFE.r, 0.24, 18), C(16, 44, 52), 1);
  addFace(circlePts(SAFE.x, SAFE.z, SAFE.r, 0.26, 18), C(0, 229, 255), 0.16);
  /* Lane dashes near the camera only. */
  const dash = C(56, 62, 82);

  if (ph && ph.type === 'jackMarked' && !MSN.markedCar) {

    MSN.markedCar.marked = true;

}
function startMission(i) {
  MSN.idx = i; MSN.phase = 0;
  const def = MISSIONS[i];
  MSN.mTimer = def.timeLimit || 0;
  if (def.setWanted) { G.wanted = Math.max(G.wanted, def.setWanted); G.lastCrimeT = T; }
  setupPhase();
  showToast('MISSION ' + (i + 1) + ' — ' + def.name.toUpperCase(), def.phases[0].text);
}
function nextPhase() {
  MSN.phase++;
  if (MSN.phase >= MISSIONS[MSN.idx].phases.length) { completeMission(); return; }
  setupPhase();
  AU.pickup();
  showToast('OBJECTIVE UPDATED', currentPhase().text);
}
function completeMission() {
  const def = MISSIONS[MSN.idx];
  G.money += 100;
  AU.jingle();
  MSN.idx++;
  if (MSN.idx >= MISSIONS.length) {
    G.freeRoam = true;
    showBanner('ALL MISSIONS COMPLETE', def.name + ' paid +$100 — Night City is yours. Cash: $' + G.money);
    return;
  }
  showBanner('MISSION COMPLETE', def.name + '  +$100');
  startMission(MSN.idx);
}
function failMission() {
  showToast('TOO SLOW', 'Mission restarted — the city does not wait');
  AU.crash(false);
  startMission(MSN.idx);
}
function updateMissions(dt) {
  if (!G.started || G.freeRoam || G.bustedT > 0) return;
  const def = MISSIONS[MSN.idx];
  const ph = currentPhase();
  if (!def || !ph) return;
  if (def.timeLimit) {
    MSN.mTimer -= dt;
    if (MSN.mTimer <= 0) { failMission(); return; }
  }
  const dSafe = Math.sqrt(dist2(P.x, P.z, SAFE.x, SAFE.z));
  switch (ph.type) {
    case 'goto': {
      const d = Math.sqrt(dist2(P.x, P.z, ph.x, ph.z));
      if (d < ph.r && (!ph.needCar || P.inCar)) nextPhase();
      break;
    }
    case 'jack':
      if (P.inCar && P.inCar.stolen && P.inCar !== MSN.carAtStart) nextPhase();
      break;
    case 'jackMarked':
      if (MSN.markedCar && P.inCar === MSN.markedCar) nextPhase();
      break;
    case 'collect': {
      for (const pk of MSN.points) {
        if (!pk.taken && dist2(P.x, P.z, pk.x, pk.z) < 25) {
          pk.taken = true; AU.pickup();
          const left = MSN.points.filter(p => !p.taken).length;
          showToast('PACKAGE COLLECTED', left > 0 ? left + ' to go' : 'That is the lot');
        }
      }
      if (MSN.points.every(p => p.taken)) nextPhase();
      break;
    }
    case 'survive': {
      const on = ph.cond === 'spot' ? (H.active && H.inSpot) : (G.wanted >= ph.minWanted);
      if (on) { MSN.progress += dt; if (MSN.progress >= ph.dur) nextPhase(); }
      break;
    }
    case 'escape':
      if (dSafe < SAFE.r) nextPhase();
      break;
    case 'park':
      if (MSN.markedCar && P.inCar === MSN.markedCar && Math.abs(P.inCar.speed) < 1 &&
          dist2(P.x, P.z, ph.x, ph.z) < ph.r * ph.r) nextPhase();
      break;
  }
}

/* ---------------- Camera, start, main loop ---------------- */
function updateCamera(dt) {
  if (!G.started) {
    const yaw = T * 0.045;
    cam.yaw = yaw + Math.PI;
    cam.x = Math.sin(yaw) * 148; cam.z = Math.cos(yaw) * 148; cam.y = 58;
    cam.pitch = -0.42;
    return;
  }
  if (G.camYaw === undefined) G.camYaw = P.heading;
  G.camYaw = angLerp(G.camYaw, P.heading, dt * (P.inCar ? 2.8 : 3.6));
  cam.yaw = G.camYaw;
  const dist = P.inCar ? 13.5 : 10.5, height = P.inCar ? 6.6 : 5.4;
  const fx = Math.sin(cam.yaw), fz = Math.cos(cam.yaw);
  cam.x = P.x + fx * 3.5 - fx * dist;
  cam.z = P.z + fz * 3.5 - fz * dist;
  cam.y = 1.4 + height;
  cam.pitch = P.inCar ? -0.315 : -0.30;
}
function startGame() {
  if (G.started) return;
  G.started = true;
  AU.init(); AU.click();
  G.camYaw = P.heading;
  startMission(0);
}
function stepGame(dt) {
  while (actionQueue.length) {
    const a = actionQueue.shift();
    if (a === 'start' && !G.started) startGame();
    else if (a === 'enter' && G.started) tryEnterExit();
  }
  if (mouseClicked) {
    mouseClicked = false;
    if (!G.started && mouseX >= startBtn.x && mouseX <= startBtn.x + startBtn.w &&
        mouseY >= startBtn.y && mouseY <= startBtn.y + startBtn.h) startGame();
  }
  if (!G.started) return;
  if (TEST.on) updateTest(dt);
  if (G.bustedT <= 0) {
    if (P.inCar && P.inCar.testDrive) vkeys.KeyW = true; /* staged chase drives itself */
    updatePlayer(dt);
    updateTraffic(dt);
    updatePolice(dt);
    updateHelicopter(dt);
    updateWanted(dt);
    updateMissions(dt);
    collideCars(dt);
  } else {
    updateTraffic(dt);
  }
  updateBusted(dt);
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }
  if (G.toast) { G.toast.t -= dt; if (G.toast.t <= 0) G.toast = null; }
  let prox = 0;
  if (G.wanted > 0) {
    let nd = 1e9;
    for (const c of CARS) if (c.kind === 'police' && c.active && !c.driver) nd = Math.min(nd, Math.sqrt(dist2(c.x, c.z, P.x, P.z)));
    prox = clamp(1 - nd / 95, 0, 1);
  }
  AU.setSiren(G.wanted > 0 && G.bustedT <= 0, prox);
  if (!P.inCar) AU.setEngine(false, 0, false);
  G.thunderT -= dt;
  if (G.thunderT <= 0) { G.thunderT = 24 + Math.random() * 42; AU.thunder(); }
}
let lastTs = 0, frameCount = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, lastTs ? (ts - lastTs) / 1000 : 0.016);
  lastTs = ts; T += dt; frameCount++;
  stepGame(dt);
  updateCamera(dt);
  render();
  if (G.started && G.bustedT <= 0) drawHUD();
  if (G.bustedT > 0) drawBusted();
  if (!G.started) drawStartScreen();
}

function applyShot(n) {

    P.x = 6; P.z = 140; P.heading = Math.PI; G.camYaw = Math.PI;
  } else if (n === 2) {
    const car = CARS.find(c => c.kind === 'traffic');

    car.driver = 'player'; car.stolen = true; car.testDrive = true;
    P.inCar = car; P.x = car.x; P.z = car.z; P.heading = car.heading;
    G.camYaw = Math.PI;
    G.wanted = 4; G.lastCrimeT = T; G.money = 500;
    const offs = [[7, 21], [-7, 25], [12, 35], [-12, 39]];
    let i = 0;
    for (const c of CARS) {
      if (c.kind !== 'police') continue;
      const o = offs[i++];
      c.x = P.x + o[0]; c.z = P.z + o[1]; c.heading = Math.PI; c.speed = 25; c.active = true;
    }
    H.active = true; H.x = P.x + 8; H.z = P.z - 16; H.h = 24; H.spot.x = P.x; H.spot.z = P.z;
    MSN.idx = 5; MSN.phase = 1; setupPhase();

    G.money = 300;
    MSN.idx = 3; MSN.phase = 0; setupPhase();

    showToast('WANTED CLEARED', 'The safehouse crew makes you a ghost');

function finishTest(pass, why) {
  if (TEST.done) return;
  TEST.done = true;
  document.title = pass ? 'SBTEST PASS' : 'SBTEST FAIL: ' + why;
}
function updateTest(dt) {
  TEST.t += dt;
  for (const k in vkeys) delete vkeys[k];
  if (TEST.done) return;
  if (TEST.stage === 0) {
    vkeys.KeyW = true;
    if (TEST.t > 1.6) { TEST.stage = 1; TEST.lastX = P.x; TEST.lastZ = P.z; TEST.stuckT = 0; TEST.sideT = 0; }
  } else if (TEST.stage === 1) {
    let best = null, bd = 1e9;
    for (const c of CARS) {
      if (c.kind !== 'traffic' || c.driver) continue;
      const d = dist2(P.x, P.z, c.x, c.z);
      if (d < bd) { bd = d; best = c; }
    }
    if (!best) { finishTest(false, 'no traffic car'); return; }
    best.testParked = true;
    if (bd < 3.4 * 3.4) { actionQueue.push('enter'); TEST.stage = 2; TEST.t2 = 0; }
    else {
      /* Walk at the car; if a building face wedges us, sidestep briefly. */
      const moved = Math.hypot(P.x - TEST.lastX, P.z - TEST.lastZ);
      TEST.stuckT = moved < 0.35 ? TEST.stuckT + dt : 0;
      TEST.lastX = P.x; TEST.lastZ = P.z;
      let desired = Math.atan2(best.x - P.x, best.z - P.z);
      if (TEST.stuckT > 1.2) { TEST.sideT = 0.7; TEST.stuckT = 0; }
      if (TEST.sideT > 0) { TEST.sideT -= dt; desired += Math.PI / 2; }
      G.camYaw = desired;
      vkeys.KeyW = true; vkeys.ShiftLeft = true;
    }
  } else if (TEST.stage === 2) {
    TEST.t2 += dt;
    if (P.inCar) { TEST.stage = 3; TEST.t3 = 0; }
    else if (TEST.t2 > 2.5) finishTest(false, 'could not enter car');
  } else if (TEST.stage === 3) {
    TEST.t3 += dt;
    vkeys.KeyW = true;
    if (TEST.t3 > 2.5) {
      const ok = !!(P.inCar && P.inCar.stolen);
      finishTest(ok, ok ? '' : 'not driving a jacked car');
    }
  }
  if (TEST.t > 30) finishTest(false, 'timeout');
}
window.__SB = {
  get state() {
    return {
      started: G.started, money: G.money, hp: Math.round(G.hp), wanted: G.wanted,
      mission: MSN.idx, phase: MSN.phase, inCar: !!P.inCar,
      px: Math.round(P.x), pz: Math.round(P.z), frames: frameCount,
      cars: CARS.length, heli: H.active, inSpot: H.inSpot,
    };
  },
};

/* ---------------- Init ---------------- */
fitCanvas();
spawnCars();
const shotN = parseInt(Q.get('shot') || '0', 10);
if (shotN >= 1 && shotN <= 3) applyShot(shotN);
else if (TEST.on) startGame();
requestAnimationFrame(loop);
</script>
